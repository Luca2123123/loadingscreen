<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Night Roleplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Eigenes Hintergrundbild: Link eintragen, z. B. url("https://deinedomain.de/bg.jpg")
     "none" = gezeichnete Nachtlandschaft */
  :root { --bg-image: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: Roboto, Arial, sans-serif; color: #fff; background: #060425; }

  /* ---------- Hintergrund ---------- */
  .bg { position: fixed; top: -20px; left: -20px; width: calc(100% + 40px); height: calc(100% + 40px); z-index: 0; filter: blur(4px) brightness(.75);
        background-image: var(--bg-image); background-size: cover; background-position: center; }
  .bg svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .dim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: linear-gradient(180deg, rgba(5,3,40,.25), rgba(2,0,20,.55)); }

  .layer { position: fixed; z-index: 2; }

  /* ---------- Oben links ---------- */
  .brand { top: 16px; left: 20px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .brand h1 { font-size: clamp(2rem, 2.9vw, 3.1rem); font-weight: 700; line-height: 1.05; letter-spacing: -.01em; }
  .brand p  { font-size: clamp(1rem, 1.3vw, 1.4rem); margin-top: 4px; }

  /* ---------- Oben Mitte ---------- */
  .links { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-size: clamp(1rem, 1.25vw, 1.3rem); line-height: 1.7; }
  .links div { display: flex; align-items: center; justify-content: center; }
  .links svg { margin-right: 10px; }
  .links svg { width: 18px; height: 18px; fill: #fff; }
  .welcome { top: 124px; left: 50%; transform: translateX(-50%); font-size: clamp(1.1rem, 1.5vw, 1.6rem); white-space: nowrap; }
  .welcome b { font-weight: 700; }

  /* ---------- Regeln (links, unter dem Titel) ---------- */
  .rules { top: 130px; left: 20px; width: min(26vw, 420px); background: rgba(15,18,38,.78); padding: 14px 18px 16px; }
  .rules h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .rules ul { list-style: none; display: grid; gap: 7px; }
  .rules li { font-size: .92rem; line-height: 1.35; padding-left: 14px; position: relative; }
  .rules li::before { content: ""; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: #5ec8ff; }

  /* ---------- Team (oben rechts) ---------- */
  .team { top: 64px; right: 14px; width: clamp(300px, 15.7vw, 420px); background: rgba(33,38,52,.82); }
  .team li { list-style: none; display: grid; grid-template-columns: 50px 1fr; height: 60px; align-items: center; }
  .team .pic { width: 40px; height: 40px; margin-left: 9px; background: #1b1f2c center/cover; display: grid; place-items: center; font-weight: 700; color: #cfd6ee; }
  .team .txt { border-left: 1px solid rgba(255,255,255,.12); height: 44px; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; margin-left: 0; }
  .team .name { font-size: 1rem; line-height: 1.2; }
  .team .role { font-size: .95rem; line-height: 1.3; color: #e4e7f2; }

  /* ---------- Unten links ---------- */
  .bottom { left: 20px; bottom: 14px; width: min(28vw, 540px); display: grid; gap: 10px; }
  .player { background: rgba(0,0,0,.72); padding: 10px; display: grid; grid-template-columns: 75px 1fr 1fr; gap: 14px; align-items: center; }
  .avatar { width: 75px; height: 75px; background: #2a2f45 center/cover; display: grid; place-items: center; font-size: 2rem; font-weight: 700; color: #aab3d6; }
  .pname { font-size: 1rem; }
  .psid  { font-size: 1rem; margin-top: 6px; }
  .meta { display: grid; gap: 6px; font-size: .95rem; }
  .meta div { display: flex; align-items: center; white-space: nowrap; }
  .meta svg { margin-right: 8px; }
  .meta svg { width: 16px; height: 16px; fill: #fff; flex: none; }

  /* ---------- Fortschritt (Mitte unten) ---------- */
  .loader { left: 50%; bottom: 20px; transform: translateX(-50%); width: min(30vw, 480px); }
  .status { font-size: .8rem; margin-bottom: 6px; color: #d9def3; display: flex; justify-content: space-between; }
  .status span:last-child { margin-left: 10px; }
  .status span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; background: rgba(255,255,255,.18); }
  .bar span { display: block; height: 100%; width: 0; background: #5ec8ff; transition: width .3s; }

  @media (max-width: 1100px) { .rules, .welcome { display: none; } }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>

<div class="bg" id="bg">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a0630"/><stop offset=".5" stop-color="#2a1559"/><stop offset=".85" stop-color="#7a2f6e"/><stop offset="1" stop-color="#c2566a"/>
      </linearGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14102e"/><stop offset="1" stop-color="#05031a"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#sky)"/>
    <g id="stars" fill="#fff"></g>
    <circle cx="1230" cy="170" r="190" fill="url(#moonGlow)"/>
    <circle cx="1230" cy="170" r="62" fill="#fff3cf"/>
    <circle cx="1210" cy="152" r="10" fill="#e8dcae" opacity=".6"/><circle cx="1252" cy="190" r="14" fill="#e8dcae" opacity=".5"/>
    <!-- ferne Skyline -->
    <g id="far" fill="#26164f" opacity=".9"></g>
    <!-- nahe Skyline -->
    <g id="near" fill="#0d0826"></g>
    <g id="wins"></g>
    <!-- Strasse -->
    <rect y="745" width="1600" height="155" fill="url(#road)"/>
    <rect y="745" width="1600" height="3" fill="#ff9a5c" opacity=".5"/>
    <g id="lamps"></g>
    <g fill="#ffd9a0" opacity=".5"><rect x="80" y="840" width="120" height="6"/><rect x="420" y="840" width="120" height="6"/><rect x="760" y="840" width="120" height="6"/><rect x="1100" y="840" width="120" height="6"/><rect x="1440" y="840" width="120" height="6"/></g>
  </svg>
</div>
<div class="dim"></div>

<!-- Oben links -->
<div class="layer brand">
  <h1>Night Roleplay</h1>
  <p>Willkommen auf Night Roleplay!</p>
</div>

<!-- Oben Mitte -->
<div class="layer links">
  <div><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V22h2v-3.1A7 7 0 0019 12z"/></svg><span id="dc">discord.gg/deinserver</span></div>
</div>
<div class="layer welcome">Willkommen, <b id="wname">Spieler</b></div>

<!-- Regeln -->
<div class="layer rules" id="rulesBox"><h2>Regeln</h2><ul id="rules"></ul></div>

<!-- Team -->
<ul class="layer team" id="team"></ul>

<!-- Unten links -->
<div class="layer bottom">
  <div class="player">
    <div class="avatar" id="avatar">?</div>
    <div><div class="pname" id="pname">Spieler</div><div class="psid" id="steamid">–</div></div>
    <div class="meta">
      <div><svg viewBox="0 0 24 24"><path d="M20.5 3l-.2.1L15 5.2 9 3 3.4 4.9a.5.5 0 00-.4.5v15.1a.5.5 0 00.5.5l.2-.1L9 18.8l6 2.1 5.6-1.9a.5.5 0 00.4-.5V3.5a.5.5 0 00-.5-.5zM15 19l-6-2.1V5l6 2.1z"/></svg><span>Map: <span id="map">–</span></span></div>
      <div><svg viewBox="0 0 24 24"><path d="M21 6H3a2 2 0 00-2 2v8a2 2 0 002 2h18a2 2 0 002-2V8a2 2 0 00-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3zm4.5 2a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm4-3a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg><span><b>Gamemode:</b> <span id="gm">–</span></span></div>
      <div><svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg><span><b>Slots:</b> <span id="slots">–</span></span></div>
    </div>
  </div>
</div>

<!-- Fortschritt -->
<div class="layer loader">
  <div class="status"><span id="status">Verbinde mit dem Server …</span><span id="percent">0%</span></div>
  <div class="bar"><span id="fill"></span></div>
</div>

<script>
/* ===================== HIER ANPASSEN ===================== */
var SERVER_NAME = "Night Roleplay";
var DISCORD     = "https://discord.gg/Mj4unbCT2p";

/* Link zu deinem Cloudflare Worker (siehe Anleitung), z. B. "https://steam.deinname.workers.dev" */
var WORKER_URL  = "https://steam.langohrluca6.workers.dev";

/* Leer lassen ([]) = Regel-Box wird ausgeblendet */
var RULES = [
  "Kein RDM (Random Deathmatch) und kein VDM.",
  "Bleib immer in deiner Rolle (kein Metagaming).",
  "Respektvoller Umgang mit allen Spielern.",
  "Keine Cheats, Exploits oder Bugusing.",
  "Anweisungen des Teams sind zu befolgen."
];

/* avatar = Link zu einem Bild (quadratisch), leer = Anfangsbuchstabe */
var TEAM = [
  { name: "[NR] Lenox",    role: "Serverinhaber",         avatar: "" },
  { name: "[NR] Luca",     role: "Stellv. Serverinhaber", avatar: "" },
  { name: "[NR] Homeless", role: "Serverleiter",          avatar: "" },
  { name: "[NR] Anubis",    role: "Stellv. Serverleiter",            avatar: "" },
  { name: "[NR] Don",    role: "Teamleiter",            avatar: "" }
];
/* ========================================================= */

(function () {
  document.getElementById("web").textContent = WEBSITE;
  document.getElementById("dc").textContent  = DISCORD;

  // Regeln
  var ru = document.getElementById("rules");
  if (!RULES.length) document.getElementById("rulesBox").style.display = "none";
  RULES.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ru.appendChild(li); });

  // Team
  var tm = document.getElementById("team");
  TEAM.forEach(function (m) {
    var li = document.createElement("li");
    var pic = document.createElement("div"); pic.className = "pic";
    if (m.avatar) pic.style.backgroundImage = "url('" + m.avatar + "')";
    else pic.textContent = m.name.replace(/^\[.*?\]\s*/, "").charAt(0).toUpperCase();
    var tx = document.createElement("div"); tx.className = "txt";
    var n = document.createElement("div"); n.className = "name"; n.textContent = m.name;
    var r = document.createElement("div"); r.className = "role"; r.textContent = m.role;
    tx.appendChild(n); tx.appendChild(r); li.appendChild(pic); li.appendChild(tx); tm.appendChild(li);
  });

  // Nachtstadt zeichnen
  var NS = "http://www.w3.org/2000/svg";
  var seed = 11; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

  var stars = document.getElementById("stars");
  for (var i = 0; i < 140; i++) el("circle", { cx: rnd() * 1600, cy: rnd() * 470, r: (0.5 + rnd() * 1.3).toFixed(1), opacity: (0.3 + rnd() * 0.7).toFixed(2) }, stars);

  var far = document.getElementById("far"), x = -20;
  while (x < 1620) { var w = 50 + rnd() * 70, h = 160 + rnd() * 200; el("rect", { x: x, y: 745 - h, width: w, height: h }, far); x += w + 4; }

  var near = document.getElementById("near"), wins = document.getElementById("wins"); x = -30;
  while (x < 1620) {
    var bw = 70 + rnd() * 110, bh = 200 + rnd() * 330, by = 745 - bh;
    el("rect", { x: x, y: by, width: bw, height: bh }, near);
    if (rnd() > .65) el("rect", { x: x + bw / 2 - 2, y: by - 40, width: 4, height: 40 }, near);
    for (var wy = by + 14; wy < 730; wy += 20)
      for (var wx = x + 10; wx < x + bw - 12; wx += 16)
        if (rnd() > .55) el("rect", { x: wx, y: wy, width: 7, height: 10, fill: rnd() > .12 ? "#ffc66b" : "#6fd3ff", opacity: (0.35 + rnd() * 0.6).toFixed(2) }, wins);
    x += bw + 2 + rnd() * 6;
  }

  var lamps = document.getElementById("lamps");
  for (var l = 0; l < 6; l++) {
    var lx = 130 + l * 290;
    el("rect", { x: lx, y: 700, width: 4, height: 100, fill: "#05031a" }, lamps);
    el("circle", { cx: lx + 2, cy: 700, r: 36, fill: "#ffb35c", opacity: ".16" }, lamps);
    el("circle", { cx: lx + 2, cy: 700, r: 5, fill: "#ffe2b0" }, lamps);
  }
})();

/* ================= Garry's Mod Schnittstelle ================= */
var filesTotal = 0;

function setProgress(p) {
  p = Math.max(0, Math.min(100, p));
  document.getElementById("fill").style.width = p + "%";
  document.getElementById("percent").textContent = Math.round(p) + "%";
}

function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  document.getElementById("map").textContent    = mapname || "–";
  document.getElementById("gm").textContent     = gamemode || "–";
  document.getElementById("slots").textContent  = maxplayers || "–";
  document.getElementById("steamid").textContent = steamid || "–";
  loadSteamProfile(steamid);
}

function loadSteamProfile(id) {
  if (!WORKER_URL || !id) return;
  try {
    var x = new XMLHttpRequest();
    x.open("GET", WORKER_URL + "?id=" + encodeURIComponent(id), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status !== 200) return;
      var d = JSON.parse(x.responseText);
      if (d.name) {
        document.getElementById("pname").textContent = d.name;
        document.getElementById("wname").textContent = d.name;
      }
      if (d.avatar) {
        var a = document.getElementById("avatar");
        a.textContent = "";
        a.style.backgroundImage = "url('" + d.avatar + "')";
      }
    };
    x.send();
  } catch (e) {}
}
function SetFilesTotal(total) { filesTotal = total; }
function SetFilesNeeded(needed) { if (filesTotal > 0) setProgress(((filesTotal - needed) / filesTotal) * 100); }
function DownloadingFile(fileName) { document.getElementById("status").textContent = "Lade: " + decodeURIComponent(fileName).split("/").pop(); }
function SetStatusChanged(status) {
  document.getElementById("status").textContent = status;
  if (status === "Workshop Complete") setProgress(100);
}
</script>
</body>
</html>
